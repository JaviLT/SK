<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Kaizen · Zubex Industrial</title>
<meta name="theme-color" content="#0D18A8">

<!-- Tipografía de marca (fallback aprobado: Poppins → Segoe UI → sans-serif) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============ Barra superior ============ -->
<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">ZX</span>
      <div class="brand-text">
        <strong>Short Kaizen</strong>
        <span>Zubex Industrial</span>
      </div>
    </div>

    <nav class="tabs" id="main-tabs" aria-label="Navegación principal">
      <button class="tab" data-view="historial">Solicitudes</button>
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab admin-only" data-view="admin" hidden>Administración</button>
    </nav>

    <div class="topbar-actions">
      <button class="btn btn-accent" id="btn-nuevo">+ Nuevo Kaizen</button>
      <button class="user-chip" id="user-chip" aria-haspopup="true">
        <span id="user-chip-name">—</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ============ Menú móvil inferior ============ -->
<nav class="mobile-nav" id="mobile-nav" aria-label="Navegación móvil" hidden>
  <button class="mobile-nav-btn" data-view="historial">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12l9-9 9 9M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Solicitudes</span>
  </button>
  <button class="mobile-nav-btn" id="mobile-nuevo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>Nuevo</span>
  </button>
  <button class="mobile-nav-btn" data-view="dashboard">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="mobile-nav-btn admin-only" data-view="admin" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.6"/></svg>
    <span>Admin</span>
  </button>
</nav>

<!-- ============ Contenedor principal de vistas ============ -->
<main id="app-root">
  <!-- Cada vista se monta aquí dinámicamente vía js/router.js -->
  <div class="boot-loader" id="boot-loader">
    <div class="boot-mark">ZX</div>
    <p>Cargando Short Kaizen…</p>
  </div>
</main>

<!-- ============ Contenedor de notificaciones (toasts) ============ -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- ============ Punto de entrada de la app (ES Modules nativos) ============ -->
<script type="module" src="js/app.js"></script>
</body>
</html>

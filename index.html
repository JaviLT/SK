<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Kaizen · Zubex Industrial</title>
<meta name="theme-color" content="#0D18A8">
<link rel="icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<!--
  index.html ya NO es la SPA — cada pantalla es ahora su propio archivo .html
  real (ver README.md). Esta página solo redirige a donde corresponda:
  al link de aprobación si trae ?token=, o a Mis Kaizens / Login según haya
  sesión iniciada o no.
-->
<div class="boot-loader">
  <img src="assets/logo-mark.png" alt="" style="width:56px;height:56px;animation:boot-pulse 1.4s ease-in-out infinite">
  <p>Cargando…</p>
</div>
<script type="module">
  import { api } from "./js/api.js";
  const params = new URLSearchParams(window.location.search);
  if (params.get("token")) {
    window.location.replace(`aprobacion.html?token=${encodeURIComponent(params.get("token"))}`);
  } else {
    const user = await api.restoreSession().catch(() => null);
    window.location.replace(user ? "mis-kaizens.html" : "login.html");
  }
</script>
</body>
</html>
